services:
  - type: web
    name: persona-twin-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Secrets: set the real values in the Render dashboard, not here.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_SITE_NAME
        value: Persona Twin
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: PERSONA_NAME
        value: Your Name
      - key: PERSONA_BIO
        value: A short description of the persona.
      - key: ALLOWED_ORIGINS
        sync: false
      # Only set these if you actually use the Twitter/Instagram scraping
      # features, and only with FRESH credentials (see DEPLOY.md).
      - key: X_AUTH_TOKEN
        sync: false
      - key: X_CT0
        sync: false
      - key: INSTAGRAM_SESSIONID
        sync: false
      - key: INSTAGRAM_CSRFTOKEN
        sync: false
      - key: INSTAGRAM_DS_USER_ID
        sync: false
